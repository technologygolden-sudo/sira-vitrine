# Propose automatiquement les mises à jour de sécurité et mineures des dépendances.
# Les montées de version majeures (ex. Astro 5 -> 7) sont ignorées : elles demandent
# une migration manuelle et testée.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      mises-a-jour-mineures:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
