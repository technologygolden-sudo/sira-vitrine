# Vérifie automatiquement chaque modification envoyée sur GitHub :
# installation propre, contrôle TypeScript, génération du site, audit de sécurité.
name: Vérification du site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
